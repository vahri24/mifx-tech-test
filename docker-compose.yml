version: "3"

services:
  mifx:
    container_name: mifx
    image: vahri24/kontelers:mifx-nginx-1.0
    ports:
      - 8080:80
    networks:
      - dockernet
    restart: unless-stopped

  psql:
    container_name: psql
    image: postgres:16-alpine3.22
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "max_connections=200"]
    ports:
      - 5432:5432
    networks:
      - dockernet
    restart: unless-stopped

networks:
  dockernet:
    external:
      name: dockernet
