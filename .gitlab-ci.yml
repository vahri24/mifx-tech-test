stages:
  - build
  - deploy

# Optional: pipeline hanya dibuat kalau Dockerfile / compose berubah
workflow:
  rules:
    - changes:
        - Dockerfile
        - docker-compose.yml
        - docker-compose.yaml
        - compose.yml
        - compose.yaml
    - when: never

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  rules:
    # Jika Dockerfile berubah -> build jalan
    - changes:
        - Dockerfile
  script:
    - docker info
    # Login GitLab Container Registry (gunakan CI vars bawaan GitLab)
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:latest"

deploy:
  stage: deploy
  rules:
    # Jika Dockerfile berubah -> deploy juga jalan
    - changes:
        - Dockerfile
    # Jika docker-compose berubah -> deploy jalan (tanpa build)
    - changes:
        - docker-compose.yml
        - docker-compose.yaml
        - compose.yml
        - compose.yaml
  script:
    - echo "Deploying..."
    # === Ganti bagian ini sesuai cara deploy kamu ===
    # Contoh (SSH ke server, pull image terbaru, up -d):
    - ssh -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" \
        "cd /path/app && git pull && docker compose up -d"
